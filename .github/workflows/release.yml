name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            is-primary: true # C'est cette plateforme qui créera le brouillon de la release
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            is-primary: false
          - platform: 'windows-latest'
            args: ''
            is-primary: false

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Mise à jour vers Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libmpv1

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

            - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # 1. Création du dossier libs
          New-Item -ItemType Directory -Force -Path "apps/desktop/src-tauri/libs" | Out-Null

          # 2. Récupération de la dernière release via l'API GitHub (plus robuste qu'une URL en dur)
          Write-Host "Recherche de la dernière release de shinchiro/mpv-winbuild-cmake..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          
          # 3. Identification de l'asset libmpv-dev (x86_64)
          $asset = $release.assets | Where-Object { $_.name -like "*libmpv-dev-x86_64*.7z" } | Select-Object -First 1

          if (-not $asset) {
            Write-Error "Aucun asset libmpv-dev-x86_64 trouvé dans la dernière release."
            exit 1
          }

          $url = $asset.browser_download_url
          $zipFile = "libmpv-dev.7z"
          $extractPath = "libmpv_extracted"

          Write-Host "Téléchargement depuis : $url"
          
          # 4. Téléchargement
          Invoke-WebRequest -Uri $url -OutFile $zipFile -UseBasicParsing

          # 5. Extraction (7z est disponible par défaut sur les runners Windows)
          Write-Host "Extraction de l'archive..."
          7z x $zipFile -o$extractPath -y | Out-Null

          # 6. Copie du DLL
          $dllSource = Get-ChildItem -Path $extractPath -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          
          if ($dllSource) {
            Copy-Item $dllSource.FullName -Destination "apps/desktop/src-tauri/libs/libmpv-2.dll" -Force
            Write-Host "Succès : libmpv-2.dll copié dans libs/"
            Get-Item "apps/desktop/src-tauri/libs/libmpv-2.dll"
          } else {
            Write-Error "Échec : Fichier libmpv-2.dll introuvable dans l'archive extraite."
            exit 1
          }

          # 7. Nettoyage
          Remove-Item $zipFile -Force
          Remove-Item $extractPath -Recurse -Force

      - name: Install app dependencies and build it
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Désactivez la signature si vous n'avez pas configuré les clés, sinon le build échouera
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AetherVault Media ${{ github.ref_name }}"
          releaseBody: "Nouvelle version multiplateforme incluant les correctifs critiques v0.5.7."
          releaseDraft: ${{ matrix.is-primary }} # Seul Linux crée le brouillon
          prerelease: false
          args: ${{ matrix.args }}