name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            is-primary: true # C'est cette plateforme qui créera le brouillon de la release
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            is-primary: false
          - platform: 'windows-latest'
            args: ''
            is-primary: false

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Mise à jour vers Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libmpv1

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Installation de Scoop (gestionnaire de paquets Windows)
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          
          # Ajout du bucket 'extras' et installation de mpv
          scoop bucket add extras
          scoop install mpv
          
          # Copie de libmpv-2.dll depuis l'installation Scoop vers le dossier libs du projet
          $mpvPath = (scoop which mpv) | Split-Path
          Copy-Item "$mpvPath\libmpv-2.dll" -Destination "apps/desktop/src-tauri/libs/"
          
          # Vérification que le fichier est bien présent
          if (!(Test-Path "apps/desktop/src-tauri/libs/libmpv-2.dll")) {
            Write-Error "Échec de la copie de libmpv-2.dll"
            exit 1
          }
          Write-Host "libmpv-2.dll installé avec succès dans libs/"

      - name: Install app dependencies and build it
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Désactivez la signature si vous n'avez pas configuré les clés, sinon le build échouera
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AetherVault Media ${{ github.ref_name }}"
          releaseBody: "Nouvelle version multiplateforme incluant les correctifs critiques v0.5.7."
          releaseDraft: ${{ matrix.is-primary }} # Seul Linux crée le brouillon
          prerelease: false
          args: ${{ matrix.args }}