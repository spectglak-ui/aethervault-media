name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Mise à jour vers Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3 # Mise à jour pnpm action
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libmpv1

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          # Téléchargement manuel de libmpv pour Windows car non disponible via choco/scoop facilement dans CI
          mkdir -p apps/desktop/src-tauri/libs
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20240505/libmpv-2.dll.zip" -OutFile "libmpv.zip"
          Expand-Archive -Path "libmpv.zip" -DestinationPath "temp_lib"
          Copy-Item "temp_lib/libmpv-2.dll" -Destination "apps/desktop/src-tauri/libs/"
          # Note: Adaptez l'URL si nécessaire pour une version plus récente

      - name: Install app dependencies and build it
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AetherVault Media ${{ github.ref_name }}"
          releaseBody: "Voir les notes de version pour les détails."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}