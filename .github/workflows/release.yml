name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            is-primary: true # C'est cette plateforme qui créera le brouillon de la release
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            is-primary: false
          - platform: 'windows-latest'
            args: ''
            is-primary: false

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Mise à jour vers Node 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libmpv1

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Créer le dossier libs
          New-Item -ItemType Directory -Force -Path "apps\desktop\src-tauri\libs"
          
          # Utiliser une URL stable pour libmpv-2.dll (build shinchiro récent)
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20241103/libmpv-2.dll.zip"
          
          Write-Host "Téléchargement de libmpv depuis : $url"
          Invoke-WebRequest -Uri $url -OutFile "libmpv.zip" -UseBasicParsing
          
          # Extraire et copier
          Expand-Archive -Path "libmpv.zip" -DestinationPath "temp_lib" -Force
          Copy-Item "temp_lib\libmpv-2.dll" -Destination "apps\desktop\src-tauri\libs\" -Force
          
          # Nettoyage
          Remove-Item "libmpv.zip", "temp_lib" -Recurse -Force
          
          Write-Host "libmpv-2.dll installé avec succès dans libs/"

      - name: Install app dependencies and build it
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Désactivez la signature si vous n'avez pas configuré les clés, sinon le build échouera
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AetherVault Media ${{ github.ref_name }}"
          releaseBody: "Nouvelle version multiplateforme incluant les correctifs critiques v0.5.7."
          releaseDraft: ${{ matrix.is-primary }} # Seul Linux crée le brouillon
          prerelease: false
          args: ${{ matrix.args }}