name: Build Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      # Installation des dépendances système pour Linux
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmpv-dev

      # Installation des dépendances système pour macOS
      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      # Note pour Windows: libmpv doit être géré via un script pre-build ou inclus dans le repo
      # Si libmpv.dll n'est pas dans le repo, le build Windows sur GitHub échouera sans étape supplémentaire.
      # Pour l'instant, on suppose que le build Windows local suffit ou que vous ajouterez la DLL plus tard.

      - name: Build Frontend
        run: pnpm --filter @aethervault/desktop run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v0.5.7-${{ github.run_number }}
          releaseName: "AetherVault Media v0.5.7"
          releaseDraft: true
          prerelease: false