name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dépendances système Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            curl \
            wget \
            nasm \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install NASM 2.16.03 macOS
        if: matrix.platform == 'macos-latest'
        run: |
          curl -L --fail --silent --show-error \
            https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz \
            -o /tmp/nasm-2.16.03.tar.xz

          tar -xf /tmp/nasm-2.16.03.tar.xz -C /tmp

          cd /tmp/nasm-2.16.03
          ./configure --prefix="$HOME/nasm-2.16.03"
          make -j"$(sysctl -n hw.ncpu)"
          make install

          echo "$HOME/nasm-2.16.03/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/nasm-2.16.03/bin:$PATH"
          nasm -v

      - name: Vérification libmpv Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dll = "apps/desktop/src-tauri/libmpv-2.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "libmpv-2.dll est introuvable dans le checkout."
            exit 1
          }
          Write-Host "libmpv-2.dll trouvé."

      - name: Dépendances frontend
        run: pnpm install --frozen-lockfile

      - name: Build + bundle Tauri
        run: pnpm --filter @aethervault/desktop exec tauri build ${{ matrix.args }}

      - name: Collecte des artefacts
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target -path "*release/bundle*" \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec cp {} dist/ \;
          ls -la dist

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharge les artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crée la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: false
          generate_release_notes: true