[package]
name = "aethervault-media"
version = "0.5.0"
description = "AetherVault Media — centre multimédia personnel local-first"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aethervault_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ureq = { version = "2", features = ["json"] }
getrandom = "0.2"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
notify = "6"
regex = "1"
libloading = "0.8"
image = "0.25.8"
kamadak-exif = "0.6"
base64 = "0.22"
rayon = "1"
igd = "0.12"
sha2 = "0.10"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
